name: Release

on:
  push:
    tags: ["v*"]

jobs:
  check-version:
    name: Check tag matches package version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare tag with Cargo.toml version
        run: |
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}" >&2
            exit 1
          fi

  build:
    name: Build wheel (${{ matrix.platform.artifact }})
    needs: check-version
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - { runner: ubuntu-latest, target: x86_64, artifact: linux-x86_64 }
          - { runner: ubuntu-24.04-arm, target: aarch64, artifact: linux-aarch64 }
          - { runner: macos-15-intel, target: x86_64, artifact: macos-x86_64 }
          - { runner: macos-latest, target: aarch64, artifact: macos-aarch64 }
          - { runner: windows-latest, target: x64, artifact: windows-x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform.artifact }}
          path: dist

  sdist:
    name: Build sdist
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  test:
    name: Test (${{ matrix.platform.artifact }}, ${{ matrix.python-version }})
    needs: build
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        platform:
          - { runner: ubuntu-latest, artifact: linux-x86_64 }
          - { runner: ubuntu-24.04-arm, artifact: linux-aarch64 }
          - { runner: macos-15-intel, artifact: macos-x86_64 }
          - { runner: macos-latest, artifact: macos-aarch64 }
          - { runner: windows-latest, artifact: windows-x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: wheel-${{ matrix.platform.artifact }}
          path: dist
      - name: Install the built wheel and test dependencies
        shell: bash
        run: |
          python -m pip install dist/*.whl
          python -m pip install pytest PySSTV lameenc
      - name: Run the test suite against the installed wheel
        shell: bash
        run: python -m pytest tests

  publish:
    name: Publish to PyPI
    needs: [test, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
