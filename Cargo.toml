[package]
name = "sstv-py"
version = "0.1.0"
edition = "2021"
description = "Python bindings for the sstv crate: decode slow-scan television (SSTV) transmissions"
license = "MIT"

[lib]
name = "_sstv"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.26", features = ["extension-module", "abi3-py39"] }
numpy = "0.26"
sstv = "0.1.2"
